# KitBattleLite 设置项

# 在插件启用时读取，改完执行 /kbl reload 即可热重载，无需重启。

# 选完职业后的免伤秒数，0 = 不保护
protection-seconds: 3

# 死亡重生后的失明 tick 数，0 = 不失明
death-blindness-ticks: 40

sidebar:
  # 是否显示 FastBoard 侧边栏（连杀/击杀/死亡/K-D）
  enabled: true

health-below-name:
  # 是否用共享计分板显示玩家名下血量；服上已有 HUD 插件时可关掉
  enabled: true

mushroom-stew:
  # 是否启用蘑菇煲即刻回血：竞技场中右键食用按下面的数值回血，并把蘑菇煲变成碗；
  # 满血时不消耗；
  # 开启时，竞技场中将允许丢弃碗；
  # 关闭时保持旧行为。
  enabled: true
  # 每次右键恢复的血量点数。
  # 填 0 或负数视为整套效果关闭。
  heal-amount: 6.0

food-retention:
  # 是否在竞技场内维持玩家饱食度不下降
  enabled: true
